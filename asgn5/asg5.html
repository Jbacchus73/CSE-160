<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Assignment 5</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    #loading .progress {
      margin: 1.5em;
      border: 1px solid white;
      width: 50vw;
    }

    #loading .progressbar {
      margin: 2px;
      background: white;
      height: 1em;
      transform-origin: top left;
      transform: scaleX(0);
    }

    #switchControls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      padding: 8px 12px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      cursor: pointer;
    }

    #instructions {
      position: fixed;
      bottom: 10px;
      left: 10px;
      z-index: 10;
      padding: 8px 12px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      border-radius: 6px;
      line-height: 1.5;
    }

    /* ---- Escape settings menu ---- */
    #menuOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(10, 12, 16, 0.55);
      backdrop-filter: blur(4px);
      font-family: Arial, Helvetica, sans-serif;
    }

    #menuOverlay.open {
      display: flex;
    }

    #menuPanel {
      width: 340px;
      max-width: 90vw;
      max-height: 88vh;
      overflow-y: auto;
      background: rgba(28, 30, 38, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 22px 24px 26px;
      color: #f0f1f4;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
    }

    #menuPanel h2 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    #menuPanel .subtitle {
      margin: 0 0 18px;
      font-size: 12px;
      color: #9aa0ad;
    }

    #menuPanel h3 {
      margin: 4px 0 6px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: #8a90a0;
    }

    .menu-row {
      margin: 14px 0;
    }

    .menu-row label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #c7ccd6;
    }

    .menu-row .value {
      float: right;
      color: #8fb4ff;
      font-variant-numeric: tabular-nums;
    }

    .menu-row input[type="range"] {
      width: 100%;
      accent-color: #5b8cff;
    }

    .menu-btn {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #3a6df0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .menu-btn:hover {
      background: #2f5ed6;
    }

    .menu-btn.secondary {
      background: rgba(255, 255, 255, 0.08);
    }

    .menu-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* small side-by-side buttons for prev/next */
    .menu-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .menu-btn-row .menu-btn {
      margin-top: 0;
      flex: 1;
    }

    .menu-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 18px 0 14px;
    }

    #nowPlaying {
      margin-top: 10px;
      font-size: 12px;
      color: #9aa0ad;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    #menuHint {
      margin-top: 16px;
      font-size: 11px;
      color: #7c828f;
      text-align: center;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <canvas id="c"></canvas>

  <button id="switchControls">Switch to Free Roam Controls</button>

  <div id="instructions">
    Walk: click to look, WASD to move.<br>
    Free Roam: click-drag to look, WASD to move, Space/C up/down, Shift sprint.<br>
    Press <b>Esc</b> for settings.
  </div>

  <!-- Escape settings menu -->
  <div id="menuOverlay">
    <div id="menuPanel">
      <h2>Settings</h2>
      <p class="subtitle">Press Esc to close</p>

      <h3>Environment</h3>

      <div class="menu-row">
        <label>Cycle Speed <span class="value" id="speedVal"></span></label>
        <input type="range" id="speedSlider" min="0" max="0.3" step="0.001">
      </div>

      <div class="menu-row">
        <label>Sun Intensity <span class="value" id="sunVal"></span></label>
        <input type="range" id="sunSlider" min="0" max="6" step="0.01">
      </div>

      <div class="menu-row">
        <label>Moon Intensity <span class="value" id="moonVal"></span></label>
        <input type="range" id="moonSlider" min="0" max="3" step="0.01">
      </div>

      <div class="menu-divider"></div>

      <h3>Audio</h3>

      <button class="menu-btn" id="audioToggle">🔊 Start Ambient</button>

      <div class="menu-row">
        <label>Music Volume <span class="value" id="musicVolVal"></span></label>
        <input type="range" id="musicVolSlider" min="0" max="1" step="0.01">
      </div>

      <button class="menu-btn" id="musicPlay">▶ Play / Pause Music</button>

      <div class="menu-btn-row">
        <button class="menu-btn secondary" id="musicPrev">⏮ Prev</button>
        <button class="menu-btn secondary" id="musicNext">Next ⏭</button>
      </div>

      <div id="nowPlaying">No track playing</div>

      <div class="menu-divider"></div>

      <button class="menu-btn secondary" id="resumeBtn">Resume</button>

      <div id="menuHint">Tip: Esc also exits Walk look-mode</div>
    </div>
  </div>

  <div id="loading">
    <div class="progress">
      <div class="progressbar"></div>
    </div>
  </div>

  <script type="module" src="asg5.js"></script>
</body>
</html>
