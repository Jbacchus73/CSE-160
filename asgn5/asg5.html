<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Assignment 5</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    #loading .progress {
      margin: 1.5em;
      border: 1px solid white;
      width: 50vw;
    }

    #loading .progressbar {
      margin: 2px;
      background: white;
      height: 1em;
      transform-origin: top left;
      transform: scaleX(0);
    }

    #switchControls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      padding: 8px 12px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      cursor: pointer;
    }

    #instructions {
      position: fixed;
      top: 50px;
      left: 10px;
      z-index: 10;
      padding: 8px 12px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <canvas id="c"></canvas>

  <button id="switchControls">Switch to Free Roam Controls</button>

  <div id="instructions">
    Orbit: drag mouse to rotate.<br>
    Free Roam: click-drag to look, WASD to move, Space/C up/down, Shift sprint.
  </div>

  <div id="loading">
    <div class="progress">
      <div class="progressbar"></div>
    </div>
  </div>

  <script type="module" src="asg5.js"></script>
</body>
</html>
